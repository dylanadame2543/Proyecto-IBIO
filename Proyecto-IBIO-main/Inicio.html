<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IBIO Encuesta - Acceso</title>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="style/inicio.css">
</head>
<body>

    <div class="auth-container">
        <h2>Acceso IBIO</h2>
        <input type="email" id="email" placeholder="Correo electrónico" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        
        <button id="btnLogin">Iniciar Sesión</button>
        <button id="btnRegister">Registrar Nuevo Usuario</button>
        
        <p id="statusMessage"></p>
    </div>

    <input
    type="file" id="pdfInput" accept=".pdf" style="display: none;"> 

    <!-- Enlace al archivo JavaScript (tipo módulo) -->
    <script type="module" src="main.js"></script>
    <!-- Enlace al archivo JavaScript LM Studio (tipo módulo) -->
    <script type="module" src="js/lmstudio.js"></script>
</body>
</html>
